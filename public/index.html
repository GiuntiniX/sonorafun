    function t(key) { return translations[currentLang]?.[key] || key; }
    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('sonoraLang', lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      document.querySelectorAll('[data-i18n]').forEach(el => { const text = t(el.dataset.i18n); if (text) el.innerHTML = text; });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const text = t(el.dataset.i18nPlaceholder); if (text) el.placeholder = text; });
    }

    function playSound(type) {
      if (type === 'add') return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.value = 0.15;
        if (type === 'like') {
          osc.frequency.value = 800;
          osc.type = 'sine';
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
          return;
        }
        osc.frequency.value = 600;
        osc.type = 'sine';
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}
    }

      el.classList.add('show');

    }

    function formatDuration(s) { if (!s || s <= 0) return '0:00'; const m = Math.floor(s/60); const sec = Math.floor(s%60); return m + ':' + sec.toString().padStart(2,'0'); }

    function showLogin() { $('landingScreen').style.display = 'none'; $('loginScreen').classList.add('active'); }

    // ===== CORREÇÃO: submitSignup =====
    async function submitSignup() {
      const nome = $('signupNome').value.trim();
      const email = $('signupEmail').value.trim();
      const senha = $('signupPassword').value.trim();
      const estilos = Array.from(document.querySelectorAll('#signupStyles .chip.selected')).map(c => c.dataset.style);
      
      if (nome.length < 2) return toast('Digite seu nome', 'error');
      if (!email.includes('@')) return toast('E-mail inválido', 'error');
      if (senha.length < 6) return toast('Senha deve ter 6+ caracteres', 'error');
      if (estilos.length === 0) return toast('Escolha um estilo musical', 'error');

      const btn = document.querySelector('#signupModal .btn-primary');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '⏳ Criando conta...';

      try {
        await firebase.auth().createUserWithEmailAndPassword(email, senha);
        
        const res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha, estilos })
        });
        const data = await res.json();
        if (!res.ok) {
          try { await firebase.auth().currentUser?.delete(); } catch (_) {}
          throw new Error(data.error || 'Erro ao salvar dados');
        }

        const loginRes = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        const loginData = await loginRes.json();
        if (!loginRes.ok) throw new Error(loginData.error || 'Erro ao fazer login automático');

        currentUser = loginData.user;
        myName = currentUser.nome;
        myAvatar = currentUser.avatar || '🎸';
        myPoints = currentUser.points || 0;
        myBadges = currentUser.badges || [];

        closeSignup();
        hideLogin();
        $('landingScreen').style.display = 'none';
        showScreen('lobby');
        updateUserInfo();
        loadRooms();
        checkAdmin();
        loadFavorites();
        toast('Bem-vindo(a) ' + myName + '! 🎉', 'success');
      } catch (e) {
        console.error('Erro no cadastro:', e);
        toast(e.message || 'Erro ao criar conta', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    // ===== CORREÇÃO: doLogin =====
    async function doLogin() {
      const email = $('loginEmail').value.trim();
      const senha = $('loginPassword').value.trim();
      const errorEl = $('loginError');
      if (!email || !senha) {
        errorEl.textContent = 'Preencha e-mail e senha';
        errorEl.classList.add('show');
        return;
      }
      const btn = $('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      try {
        await firebase.auth().signInWithEmailAndPassword(email, senha);
        
        let res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        let data = await res.json();
        if (!res.ok) {
          // Se o usuário não existir no Firestore, tenta criar
          if (res.status === 404 || data.error?.includes('não encontrado')) {
            await fetch('/api/signup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                nome: email.split('@')[0] || 'Usuário', 
                email, 
                senha, 
                estilos: ['pop'] 
              })
            });
            // Tenta novamente
            const retryRes = await fetch('/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, senha })
            });
            const retryData = await retryRes.json();
            if (!retryRes.ok) throw new Error(retryData.error || 'Erro ao criar usuário');
            data = retryData;
          } else {
            throw new Error(data.error || 'Erro no servidor');
          }
        }
        
        currentUser = data.user;
        myName = currentUser.nome;
        myAvatar = currentUser.avatar || '🎸';
        myPoints = currentUser.points || 0;
        myBadges = currentUser.badges || [];
        
        hideLogin();
        $('landingScreen').style.display = 'none';
        showScreen('lobby');
        updateUserInfo();
        loadRooms();
        checkAdmin();
        loadFavorites();
        toast('Bem-vindo(a) de volta ' + myName + '!', 'success');
      } catch (e) {
        console.error('Erro no login:', e);
        if (e.code === 'auth/invalid-credential' || e.message.includes('invalid-credential')) {
          errorEl.textContent = 'E-mail ou senha incorretos.';
        } else if (e.message.includes('Usuário não encontrado')) {
          errorEl.textContent = 'Usuário não cadastrado. Crie uma conta!';
        } else {
          errorEl.textContent = e.message || 'Erro ao fazer login';
        }
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar no palco';
      }
    }

    function doLogout() {
      firebase.auth().signOut().catch(() => {});
      fetch('/api/logout', { method: 'POST' }).catch(() => {});

        if (!rooms.length) { c.innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:10px;">Nenhuma sala ativa</div>'; return; }
        let html = '';
        for (const room of rooms) {
          html += `<div style="margin-bottom:12px;background:var(--bg);border-radius:6px;padding:8px;border:1px solid var(--border);">`;
          html += `<div style="font-weight:600;font-size:13px;color:var(--text);margin-bottom:4px;">${escapeHtml(room.name)} (${room.queueLength} músicas)</div>`;
          if (room.queueLength === 0) { html += `<div style="color:var(--text-muted);font-size:11px;">Fila vazia</div>`; }

            try {
              const dr = await fetch(`/api/room/${room.slug}/queue`, { credentials: 'include' });

              if (d.queue && d.queue.length) {
                d.queue.forEach((track, idx) => {
                  const isCurrent = idx === d.currentIndex;
                  html += `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px;">`;

                    html += `<button onclick="adminRemoveSong('${room.slug}', ${idx})" style="background:rgba(239,68,68,0.15);border:1px solid var(--danger);color:var(--danger);border-radius:4px;padding:0 6px;font-size:10px;cursor:pointer;">Remover</button>`;
                  } else {
                    html += `<span style="color:var(--accent);font-size:10px;">Tocando</span>`;
                  }
                  html += `</div>`;
                });
              } else { html += `<div style="color:var(--text-muted);font-size:11px;">Fila vazia</div>`; }
            } catch(e) { html += `<div style="color:var(--text-muted);font-size:11px;">Erro ao carregar</div>`; }

    // ===== LOBBY =====
    async function loadRooms() {
      const grid = $('roomGrid');
      grid.innerHTML = '<div class="empty-state"><div class="icon">🎵</div><p>Carregando salas...</p></div>';
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        const r = await fetch('/api/rooms', { signal: controller.signal });
        clearTimeout(timeout);
        if (!r.ok) throw new Error('Erro ao buscar salas');
        const roomsData = await r.json();
        if (!roomsData.length) { grid.innerHTML = '<div class="empty-state"><div class="icon">🎵</div><p>Nenhuma sala ainda. Crie a primeira!</p></div>'; return; }
        roomsData.sort((a,b) => b.listenerCount - a.listenerCount);
        grid.innerHTML = '';
        roomsData.forEach(r => {
          const card = document.createElement('div');
          card.className = 'room-card' + (r.isPlaying ? ' live' : '');
          if (r.color) card.style.borderColor = r.color;
          card.onclick = () => joinRoom(r.slug);
          const track = r.currentTrack;
          const thumb = track ? `<img src="https://img.youtube.com/vi/${track.id}/mqdefault.jpg" alt="">` : '<div style="padding:30px;text-align:center;font-size:40px;">🎧</div>';
          const live = r.isPlaying ? '<div class="room-live-badge"><span class="live-dot"></span> AO VIVO</div>' : '';
          const playingIndicator = r.isPlaying ? `<div class="playing-indicator"><span></span><span></span><span></span><span></span></div>` : '';
          const genreTag = (currentUser && currentUser.estilos && currentUser.estilos.length > 0) ? `<span class="genre-tag">🎵 ${currentUser.estilos[0]}</span>` : '';
          card.innerHTML = `
            <div class="room-thumb">${thumb} ${live} <div class="room-listeners-badge"><span class="icon">🎧</span> ${r.listenerCount || 0}</div>${playingIndicator}</div>
            <div class="room-card-body">
              <h3>${escapeHtml(r.name)} ${r.radioMode ? '📻' : ''}</h3>
              <div class="meta">
                <span class="listeners"><span class="icon">👥</span> <span class="count">${r.listenerCount || 0}</span> ouvintes</span>
                <span>🎶 ${r.queueLength || 0} na fila</span>
                ${genreTag}
              </div>
              <div class="room-avatars"><span class="avatar-mini">👤</span><span class="avatar-mini">👤</span><span class="avatar-mini">👤</span></div>
            </div>
          `;
          grid.appendChild(card);
        });
      } catch(e) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">😕</div><p>Erro ao carregar salas. Verifique sua conexão.</p></div>';
        console.error('Erro em loadRooms:', e);
      }
    }

    // ===== PLAYER =====
    function loadYouTubeAPI() { if (window.YT && window.YT.Player) { initPlayer(); return; } const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag); }
    function onYouTubeIframeAPIReady() { initPlayer(); }
    function initPlayer() {
      if (player) return;
      player = new YT.Player('youtube-player', {
        height: '280', width: '100%',
        playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, enablejsapi: 1 },
        events: {
          onReady: () => {
            const vol = parseInt($('volumeSlider').value) || 80;
            volumeLevel = vol;
            if (player && player.setVolume) player.setVolume(vol);
            if (currentRoomData) syncPlayer(currentRoomData);
          },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              const vol = parseInt($('volumeSlider').value) || 80;
              volumeLevel = vol;
              if (player && player.setVolume) {
                player.setVolume(vol);
                player.unMute();
              }
              try { const d = player.getDuration(); if (d > 0) socket.emit('videoDuration', { duration: Math.floor(d) }); } catch(e) {}
              if (crossfadeInterval) { clearInterval(crossfadeInterval); crossfadeInterval = null; }
              $('bufferingOverlay').classList.remove('show');
            }
            if (e.data === YT.PlayerState.BUFFERING) { $('bufferingOverlay').classList.add('show'); }
            if (e.data === YT.PlayerState.ENDED) socket.emit('videoEnded');
          },
          onError: () => { toast('Erro no vídeo, pulando...', 'error'); setTimeout(() => socket.emit('videoEnded'), 2000); }
        }
      });
    }

    function syncPlayer(state) {
      $('roomTitle').textContent = state.name;
      if (!player || !player.loadVideoById) return;
      currentRoomData = state;
      const track = state.queue[state.currentIndex];
      renderQueue(state.queue, state.currentIndex);
      renderWaitingQueue(state.waitingQueue);
      updateNextTrack(state.queue, state.currentIndex);
      renderPinnedMessage(state.pinnedMessage);

      if (!track) {
        currentTrackId = null;
        $('trackTitle').textContent = 'Fila vazia';
        $('trackArtist').textContent = 'Adicione uma música';
        $('trackDj').textContent = '';
        $('trackCover').innerHTML = '🎵';
        $('progressFill').style.width = '0%';
        $('currentTime').textContent = '0:00';
        $('totalTime').textContent = '0:00';
        try { player.stopVideo(); } catch(e) {}
        return;
      }

      if (currentTrackId !== track.id) {
        currentTrackId = track.id;

              player.playVideo();

        }, 500);
        setTimeout(() => {

            player.setVolume(vol);
            player.unMute();
          }
        }, 2000);

    function renderQueue(queue, currentIndex) {
      const list = $('queueList');
      const count = $('queueCount');
      count.textContent = queue.length + ' música' + (queue.length !== 1 ? 's' : '');
      list.innerHTML = '';
      if (queue.length === 0) { list.innerHTML = '<div style="color:var(--text-muted);font-size:12px;text-align:center;padding:30px 0;">Nenhuma música na fila</div>'; return; }
      const isGlobalAdmin = currentUser && currentUser.email === 'admin@sonora.com';
      const isUserAdmin = amIAdmin || isGlobalAdmin;
      queue.forEach((track, i) => {
        const div = document.createElement('div');
        div.className = 'queue-item' + (i === currentIndex ? ' current' : '');
        if (i !== currentIndex && isUserAdmin) {
          div.draggable = true;
          div.dataset.index = i;
          div.dataset.id = track._id || track.id;
          div.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', i); div.classList.add('dragging'); });
          div.addEventListener('dragend', () => div.classList.remove('dragging'));
          div.addEventListener('dragover', (e) => e.preventDefault());
          div.addEventListener('drop', (e) => { 
            e.preventDefault(); 
            const from = parseInt(e.dataTransfer.getData('text/plain')); 
            if (from === i || from === currentIndex) return; 
            const newOrder = queue.map(t => t._id || t.id); 
            const [removed] = newOrder.splice(from, 1); 
            newOrder.splice(i, 0, removed); 
            socket.emit('reorderQueue', newOrder); 
          });
        }
        const votes = queueVotes[i] || { up: [], down: [] };
        const upCount = votes.up.length;
        const downCount = votes.down.length;
        const userVotedUp = votes.up.includes(myName);
        const userVotedDown = votes.down.includes(myName);
        const total = upCount + downCount;
        const score = upCount - downCount;
        let scoreClass = '', scoreSymbol = '⚪';
        if (score > 0) { scoreClass = 'positive'; scoreSymbol = '👍'; }
        if (score < 0) { scoreClass = 'negative'; scoreSymbol = '👎'; }
        div.innerHTML = `
          <span class="pos">${i === currentIndex ? '▶' : i + 1}</span>
          <div class="thumb"><img src="https://img.youtube.com/vi/${track.id}/default.jpg" onerror="this.style.display='none'"></div>
          <div class="info">
            <div class="title">${escapeHtml(track.title || 'Música')}</div>
            <div class="artist">${escapeHtml(track.artist || 'Desconhecido')}</div>
          </div>
          <span class="dj">${escapeHtml(track.dj || '')}</span>
          <div class="queue-votes">
            <button class="vote-btn up ${userVotedUp ? 'voted-up' : ''}" onclick="event.stopPropagation();voteSong(${i}, 'up')"><span style="font-size:14px;">👍</span></button>
            <span class="vote-count ${scoreClass}" title="Total: ${total} votos (${upCount} 👍, ${downCount} 👎)">${total > 0 ? scoreSymbol + score : '0'}</span>
            <button class="vote-btn down ${userVotedDown ? 'voted-down' : ''}" onclick="event.stopPropagation();voteSong(${i}, 'down')"><span style="font-size:14px;">👎</span></button>
          </div>
        `;
        list.appendChild(div);
      });

    function startCrossfade() {
      if (crossfadeInterval) { clearInterval(crossfadeInterval); crossfadeInterval = null; }
      crossfadeInterval = setInterval(() => {
        try {
          if (!player || !player.getCurrentTime) return;
          const duration = player.getDuration();
          if (!duration || duration <= 0) return;
          const current = player.getCurrentTime();
          const remaining = duration - current;
          if (remaining <= 3 && remaining > 0) {
            const vol = parseInt($('volumeSlider').value) || 80;
            const steps = 20;
            const step = vol / steps;
            let cVol = vol;
            const fadeOut = setInterval(() => { cVol = Math.max(0, cVol - step); if (player && player.setVolume) player.setVolume(Math.round(cVol)); if (cVol <= 0) clearInterval(fadeOut); }, 50);
            setTimeout(() => clearInterval(fadeOut), 3000);
          }
        } catch(e) {}
      }, 500);
    }

    }

    function extractYouTubeId(url) {
      if (!url) return '';
      if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
      try {
        const u = new URL(url);
        if (u.hostname.includes('youtu.be')) return u.pathname.split('/').filter(Boolean)[0] || '';
        if (u.hostname.includes('youtube.com')) {
          const v = u.searchParams.get('v');
          if (v) return v;
          const parts = u.pathname.split('/').filter(Boolean);
          const markers = ['shorts', 'embed', 'live', 'watch'];
          const idx = parts.findIndex(p => markers.includes(p));
          if (idx >= 0 && parts[idx + 1]) return parts[idx + 1];
        }
      } catch(e) {}
      const match = url.match(/[a-zA-Z0-9_-]{11}/);
      return match ? match[0] : '';
    }

    async function previewSong() {
      const url = $('songUrl').value.trim();
      if (!url) { clearPreview(); return; }
      const videoId = extractYouTubeId(url);
      if (!videoId) { toast('Link do YouTube inválido', 'error'); clearPreview(); return; }
      const box = $('songPreview');
      box.classList.remove('hidden');
      $('previewThumb').innerHTML = '⏳';
      $('previewTitle').textContent = 'Buscando...';
      $('previewArtist').textContent = 'Analisando link';
      $('previewStatus').textContent = '';
      $('previewActions').classList.add('hidden');
      try {
        const r = await fetch(`/api/video-info?id=${videoId}`);
        const data = await r.json();
        if (r.ok) { songData = { id: videoId, title: data.title, artist: data.artist || 'Desconhecido', duration: data.duration || null }; showPreview(songData); return; }
      } catch(e) {
        try {
          const oembed = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
          if (oembed.ok) { const d = await oembed.json(); songData = { id: videoId, title: d.title || 'Música do YouTube', artist: d.author_name || 'Desconhecido', duration: null }; showPreview(songData); return; }
        } catch(e2) {}
        toast('Erro ao buscar informações', 'error');
        clearPreview();
      }
    }

    function showPreview(data) {
      const box = $('songPreview');
      box.classList.remove('hidden');
      const thumbHtml = data.id ? `<img src="https://img.youtube.com/vi/${data.id}/mqdefault.jpg" alt="" onerror="this.parentElement.textContent='🎵'">` : '🎵';
      const durBadge = data.duration > 0 ? `<span class="song-preview-duration">${formatDuration(data.duration)}</span>` : '';
      $('previewThumb').innerHTML = thumbHtml + durBadge;
      $('previewTitle').textContent = data.title || 'Música do YouTube';
      $('previewArtist').textContent = data.artist || 'Desconhecido';
      const confirmBtn = document.querySelector('.song-preview-confirm');
      if (data.duration > 0) {
        if (data.duration > MAX_SONG_DURATION) { $('previewStatus').textContent = `⛔ Muito longo! ${formatDuration(data.duration)} > ${MAX_SONG_DURATION/60} min`; $('previewStatus').style.color = 'var(--danger)'; confirmBtn.disabled = true; confirmBtn.textContent = '⛔ Muito longo'; }
        else if (data.duration > 300) { $('previewStatus').textContent = `⚠️ ${formatDuration(data.duration)} - música longa (máx ${MAX_SONG_DURATION/60} min)`; $('previewStatus').style.color = 'var(--warning)'; confirmBtn.disabled = false; confirmBtn.textContent = '✓ Adicionar'; }
        else { $('previewStatus').textContent = `✅ ${formatDuration(data.duration)} - dentro do limite`; $('previewStatus').style.color = 'var(--success)'; confirmBtn.disabled = false; confirmBtn.textContent = '✓ Adicionar'; }
      } else { $('previewStatus').textContent = '⚠️ Duração não verificada. O vídeo será verificado ao carregar.'; $('previewStatus').style.color = 'var(--warning)'; confirmBtn.disabled = false; confirmBtn.textContent = '✓ Adicionar (sem verificação)'; }
      $('previewActions').classList.remove('hidden');
    }

    function clearPreview() { $('songPreview').classList.add('hidden'); songData = null; }
    function confirmAdd() {
      if (!songData || !songData.id) { toast('Nenhuma música selecionada', 'error'); return; }
      if (songData.duration && songData.duration > MAX_SONG_DURATION) { toast(`⛔ Vídeo muito longo! Limite: ${MAX_SONG_DURATION/60} min`, 'error'); return; }
      const now = Date.now();
      if (now - lastAddTime < COOLDOWN) { const wait = Math.ceil((COOLDOWN - (now - lastAddTime)) / 1000); toast(`Aguarde ${wait}s`, 'error'); return; }
      socket.emit('addSong', { id: songData.id, title: songData.title || 'Música do YouTube', artist: songData.artist || 'Desconhecido', duration: songData.duration || null });
      lastAddTime = Date.now();
      $('songUrl').value = '';
      clearPreview();
      startCooldown();
      toast('🎵 Música adicionada!', 'success');
    }

    function addSong() {
      const url = $('songUrl').value.trim();
      if (!url) { toast('Cole um link do YouTube', 'error'); return; }
      const videoId = extractYouTubeId(url);
      if (!videoId) { toast('Link inválido', 'error'); return; }
      if (songData && songData.id === videoId) { confirmAdd(); } else { previewSong(); }
    }

    function startCooldown() {
      const text = $('cooldownText');
      let remaining = COOLDOWN / 1000;
      text.textContent = `Aguarde ${Math.floor(remaining/60)}m${remaining%60}s`;
      text.classList.remove('hidden');
      const interval = setInterval(() => { remaining--; if (remaining > 0) text.textContent = `Aguarde ${Math.floor(remaining/60)}m${remaining%60}s`; else { clearInterval(interval); text.classList.add('hidden'); } }, 1000);
    }

    socket.on('roomClosed', (msg) => { alert(msg); leaveRoom(); });
    socket.on('skipVoteUpdate', ({ votes, needed }) => { toast(`🗳️ Votos para pular: ${votes}/${needed}`, 'success'); });
    socket.on('waitingRoom', ({ position, maxListeners, canJoin }) => { if (canJoin) { toast('🟢 Uma vaga foi liberada! Tentando entrar...', 'success'); joinRoom(currentRoom); } else { toast(`⏳ Você está na fila de espera (posição ${position}). Aguarde uma vaga.`, 'error'); } });
    socket.on('playSound', (type) => { playSound(type); });

    // ===== PROGRESS BAR =====
    setInterval(() => {
      if (!player || !player.getCurrentTime) return;
      try {
        const current = player.getCurrentTime();
        const duration = player.getDuration();
        if (duration > 0) {
          $('progressFill').style.width = (current / duration * 100) + '%';
          $('currentTime').textContent = formatDuration(current);
          $('totalTime').textContent = formatDuration(duration);
        }
      } catch(e) {}
    }, 1000);

    // ===== INIT =====
    function init() {
      setLanguage(currentLang);
      applyTheme();
      const params = new URLSearchParams(window.location.search);
      const room = params.get('room');
      if (room) pendingRoomAfterLogin = room;
      fetch('/api/me')
        .then(res => { if (res.ok) return res.json(); throw new Error('Não autenticado'); })
        .then(data => {
          if (data.success && data.user) {
            currentUser = data.user;
            myName = currentUser.nome;
            myAvatar = currentUser.avatar || '🎸';
            myPoints = currentUser.points || 0;
            myBadges = currentUser.badges || [];
            if (currentUser.theme) { currentTheme = currentUser.theme; applyTheme(); }
            $('landingScreen').style.display = 'none';
            hideLogin();
            showScreen('lobby');
            updateUserInfo();
            loadRooms();
            checkAdmin();
            loadFavorites();
            toast('Bem-vindo(a) ' + myName + '!', 'success');
            if (pendingRoomAfterLogin) { const s = pendingRoomAfterLogin; pendingRoomAfterLogin = null; setTimeout(() => joinRoom(s), 1000); }
          }
        })
        .catch(() => {
          $('landingScreen').style.display = 'block';
          if (pendingRoomAfterLogin) toast('Faça login para entrar na sala!', 'error');
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      init();
      setInterval(() => { if (document.getElementById('screen-lobby').classList.contains('active')) { loadRooms(); } }, 15000);
    });
  </script>
